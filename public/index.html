<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ラクガキバトル</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="home" hidden>
  <div class="dots" aria-hidden="true">
    <i style="background:#e5322d"></i><i style="background:#2563e8"></i><i style="background:#f5c518"></i><i style="background:#fff"></i><i style="background:#151515"></i>
  </div>
  <h1>ラクガキバトル</h1>
  <p>自分で描いたキャラで、友達と最大4人で戦おう。</p>
  <button id="makeRoom" class="btn big">部屋をつくる</button>
  <p class="small">部屋ができたら、招待リンクを友達に送るだけ。</p>
</main>

<div id="game" hidden>
  <canvas id="cv"></canvas>

  <div id="hud">
    <button id="invite" class="btn">招待リンクをコピー</button>
    <span id="count" class="chip"></span>
  </div>

  <div id="status"></div>
  <div id="toast"></div>
  <div id="keys">← → で移動 / ↑ かスペースでジャンプ(空中でもう1回) / 崖につかまれる</div>

  <div id="pad">
    <div class="side">
      <button class="pbtn" data-k="l" aria-label="左">◀</button>
      <button class="pbtn" data-k="r" aria-label="右">▶</button>
    </div>
    <div class="side">
      <button class="pbtn small off" disabled>こうげき</button>
      <button class="pbtn small off" disabled>ひっさつ</button>
      <button class="pbtn jump" data-k="j" aria-label="ジャンプ">ジャンプ</button>
    </div>
  </div>
</div>

<script src="/draw.js"></script>
<script src="/game.js"></script>
</body>
</html>
